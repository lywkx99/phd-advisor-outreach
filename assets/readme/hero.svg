<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">phd-advisor-outreach：从了解自己到和导师坐下来谈</title>
  <desc id="desc">一个陪申请者申博的 AI skill。右侧是一份邮件母版，标出了针对每位导师要改的五处；底部是五步流程和意向阶段。</desc>

  <rect width="1200" height="500" rx="28" fill="#16213A"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="86" font-size="20" font-weight="700" letter-spacing="3" fill="#FFD95A">AI SKILL · 国内博士申请考核制</text>
    <text x="64" y="172" font-size="62" font-weight="800" fill="#FFFFFF">从了解自己</text>
    <text x="64" y="250" font-size="62" font-weight="800" fill="#FFFFFF">到<tspan fill="#FFD95A">和导师坐下来谈</tspan></text>
    <text x="64" y="306" font-size="24" font-weight="600" fill="#AEB7CE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phd-advisor-outreach</text>
    <text x="64" y="352" font-size="22" fill="#D7DCEA">像带过很多学生的前辈那样，陪你申博</text>
    <text x="64" y="386" font-size="22" fill="#D7DCEA">访谈建档 · 分轮筛导师 · 定制邮件 · 接回信</text>
  </g>

  <g id="email-master" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">
    <rect x="664" y="56" width="472" height="352" rx="22" fill="#FAF6EE"/>
    <text x="692" y="100" font-weight="800" letter-spacing="2" fill="#E4572E">邮件母版 · 每位老师只改五处</text>

    <g fill="#E4572E">
      <circle cx="704" cy="139" r="13"/><circle cx="952" cy="177" r="13"/><circle cx="704" cy="215" r="13"/>
      <circle cx="924" cy="253" r="13"/><circle cx="704" cy="329" r="13"/>
    </g>
    <g fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">
      <text x="704" y="145">1</text><text x="952" y="183">2</text><text x="704" y="221">3</text>
      <text x="924" y="259">4</text><text x="704" y="335">5</text>
    </g>

    <g fill="#FFD95A">
      <rect x="950" y="123" width="58" height="32" rx="7"/>
      <rect x="972" y="161" width="58" height="32" rx="7"/>
      <rect x="724" y="199" width="278" height="32" rx="7"/>
      <rect x="944" y="237" width="138" height="32" rx="7"/>
      <rect x="724" y="313" width="218" height="32" rx="7"/>
    </g>

    <g fill="#7A8194">
      <text x="726" y="146">主题：博士申请｜姓名｜</text>
      <text x="692" y="184">尊敬的 X 老师：我希望围绕</text>
      <text x="692" y="260">我最主要的一项工作……</text>
      <text x="692" y="298">论文列表（状态照实写）</text>
      <text x="692" y="374">请求线上交流 · 落款</text>
    </g>
    <g fill="#16213A" font-weight="700">
      <text x="959" y="146">方向</text>
      <text x="981" y="184">方向</text>
      <text x="733" y="222">经历段：选和他相关的两三项</text>
      <text x="953" y="260">从哪个角度讲</text>
      <text x="733" y="336">写给这位老师的两三句</text>
    </g>
  </g>

  <g id="route" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">
    <line x1="64" y1="432" x2="1136" y2="432" stroke="#33405F" stroke-width="2"/>
    <g fill="#FFD95A">
      <circle cx="78" cy="465" r="14"/><circle cx="252" cy="465" r="14"/><circle cx="406" cy="465" r="14"/>
      <circle cx="580" cy="465" r="14"/><circle cx="734" cy="465" r="14"/>
    </g>
    <g fill="#16213A" font-size="17" font-weight="800" text-anchor="middle">
      <text x="78" y="471">1</text><text x="252" y="471">2</text><text x="406" y="471">3</text>
      <text x="580" y="471">4</text><text x="734" y="471">5</text>
    </g>
    <g fill="#FFFFFF">
      <text x="102" y="472">了解你</text><text x="276" y="472">定位</text><text x="430" y="472">找导师</text>
      <text x="604" y="472">写信</text><text x="758" y="472">接回信</text>
    </g>
    <g stroke="#3A4767" stroke-width="3" stroke-linecap="round">
      <line x1="178" y1="465" x2="222" y2="465"/><line x1="332" y1="465" x2="376" y2="465"/>
      <line x1="506" y1="465" x2="550" y2="465"/><line x1="660" y1="465" x2="704" y2="465"/>
      <line x1="834" y1="465" x2="878" y2="465"/>
    </g>
    <rect x="896" y="445" width="240" height="40" rx="20" fill="#E4572E"/>
    <text x="1016" y="472" fill="#FFFFFF" text-anchor="middle">有意向后：读懂导师</text>
  </g>
</svg>
